name: Daily Smoke & UI Tests

on:
  # Запуск по расписанию каждый день в 06:00 UTC (09:00 по МСК)
  schedule:
    - cron: '0 6 * * *'
  
  # Возможность запустить тесты вручную кнопкой в интерфейсе GitHub
  workflow_dispatch:

  # Запуск при каждом пуше в основную ветку
  push:
    branches: [ main, master ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers & OS dependencies
        # Флаг --with-deps обязателен для установки системных Linux-библиотек браузера
        run: playwright install --with-deps chromium

      - name: Run pytest
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: pytest

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            screenshots/
          retention-days: 7