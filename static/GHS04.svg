<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- Белый фон и красный ромб GHS -->
  <polygon points="300,28 572,300 300,572 28,300" fill="#ffffff" stroke="#cc0000" stroke-width="36" stroke-linejoin="miter" />
  
  <!-- Векторный баллон со сжатым газом (GHS04) -->
  <g fill="#000000">
    <!-- Вентиль и переходник слева -->
    <rect x="130" y="286" width="16" height="28" rx="2" />
    <rect x="146" y="278" width="16" height="44" rx="2" />
    <rect x="162" y="288" width="14" height="24" />
    <polygon points="176,288 198,266 198,334 176,312" />
    <!-- Корпус баллона -->
    <rect x="198" y="260" width="220" height="80" />
    <!-- Закругленное дно баллона справа -->
    <path d="M 418,260 C 448,260 466,278 466,300 C 466,322 448,340 418,340 Z" />
  </g>
</svg>

